name: Terraform Deploy

# on: 
#   push:
#     branches:
#       - main

#   pull_request:
#    branches:
#     - main

on:
  workflow_dispatch:
    inputs:
     action:
      description: 'Terraform action to run'
      required: true
      default: 'plan'
      type: 'choice'
      options:
        - plan
        - apply
        - destroy
env:
  TF_VERSION: "1.6.0"
  TF_WORKSPACE: "dev"

jobs:
  terraform:
    name:  Terraform ${{ github.event.inputs.action || 'plan'}}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform-ec2

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: verify AWS credentials
        run: aws sts get-caller-identity

      - name: Terraform init
        run: terraform init
      
      - name: Select WorkSpace
        run: |
          terraform workspace select ${{ env.TF_WORKSPACE }} || \
          terraform workspace new ${{ env.TF_WORKSPACE }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive


      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

      # Commented trigger out: (github.event_name == 'push' && github.ref == 'refs/heads/main') ||

      - name: Terraform Apply
        if: |
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: |
          github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve
